<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lines Checker: ads.txt/sellers.json</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header-container">
    <div class="tabs" role="tablist" aria-label="File type">
      <button type="button" id="seller-tab" role="tab" aria-selected="true" class="tab active">
        <span class="tab-text">sellers.json</span>
        <span id="seller-line-count" class="line-count"></span>
      </button>
      <button type="button" id="ads-tab" role="tab" aria-selected="false" class="tab">
        <span class="tab-text">ads.txt</span>
        <span id="ads-line-count" class="line-count"></span>
      </button>
      <button type="button" id="appads-tab" role="tab" aria-selected="false" class="tab">
        <span class="tab-text">app-ads.txt</span>
        <span id="appads-line-count" class="line-count"></span>
      </button>
    </div>
    <button type="button" id="settings-toggle" class="settings-toggle" aria-label="Settings" aria-expanded="false" aria-controls="settings-panel">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.73 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .43-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
      </svg>
    </button>
  </div>

  <div id="settings-panel" class="settings-panel" style="display: none;">
    <input type="text" id="sellers-url-input" placeholder="https://pubmatic.com/sellers.json" aria-label="Sellers registry URL" aria-describedby="settings-status" />
    <button id="save-settings">Save</button>
    <button id="force-refresh-cache" title="Force sync: fetch fresh ads.txt/app-ads.txt and update sellers.json by bypassing cache">Cache</button>
  </div>

  <div id="settings-status" class="settings-status" role="status" aria-live="polite"></div>

  <div id="filter-area" class="filter-area">
    <div class="filter-left-section">
      <div id="link-block" class="link-block"></div>
      <button type="button" id="filter-left-section" class="filter-status-text" aria-pressed="true"><span id="filter-status-text">Show only pubmatic</span></button>
    </div>
    <div id="status-container" class="status-container">
      <div id="file-date" class="status-date"></div>
      <div class="badges-row">
        <div id="owner-badge" class="badge"></div>
        <div id="manager-badge" class="badge"></div>
      </div>
    </div>
  </div>

  <div id="data-status" class="data-status" role="status" aria-live="polite"></div>
  <div id="output" class="output" role="tabpanel" aria-busy="true">Loading...</div>

  <div id="quick-analyzer-bar" class="quick-analyzer-bar" style="display: none;">
    <div class="quick-stats">
      <span>Lines: <b id="qa-lines">0</b></span>
      <span>Duplicates: <b id="qa-dupes">0</b></span>
      <span>Error: <b id="qa-errors">0</b></span>
      <span>DIRECT / RESELLER: <b id="qa-ratio">0 / 0</b></span>
      <span>D/R: <b id="qa-dr" class="qa-dr-value">—</b></span>
    </div>
    <button id="qa-btn">Analyze</button>
  </div>

  <div class="footer">
    <a class="footer-link footer-link--oss" href="https://github.com/OstinUA/ads.txt-app-ads.txt-sellers.json-Lines-Checker" target="_blank" rel="noopener noreferrer">
      <span>An independent open-source project published on GitHub.</span>
      <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </div>

  <script src="../../shared/utils.js"></script>
  <script src="../../shared/network.js"></script>
  <script src="../../shared/ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
